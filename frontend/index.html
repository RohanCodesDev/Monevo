    <!-- Primary Meta Tags -->

    <!-- Structured Data (JSON-LD) for Search Engines -->

    {
      "@context": "https://schema.org",

      "description": "Minimalist, responsive personal finance and expense tracker featuring real-time analytics, category budgeting, and offline-first LocalStorage sync.",

      "offers": {
        "@type": "Offer",
        "price": "0",
